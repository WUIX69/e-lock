[env:esp32-gateway]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -DDEVICE_GATEWAY
build_src_filter = +<*> -<field-controller.cpp>

[env:esp32-field-controller]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -DDEVICE_FIELD_CONTROLLER
build_src_filter = +<*> -<main.cpp> -<fingerprint-sensor.cpp> -<lock-controller.cpp>
